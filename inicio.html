<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preferências do Usuário</title> 
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="tema-{{ tema }}">
    <div class="card">

        {% if nome %} 
            <h2>Olá, {{ nome }} </h2> 
            <p>Email: {{ email }} </p> 
        {% else %} 
            <h2>Seja bem-vindo!</h2> 
        {% endif %}

        <h1>Cookies no Flask</h1>

        <form action="{{ url_for('salvar') }}" method="POST">

            <label>Nome Completo: </label>
            <input type="text" name="nome"> <br>

            <label>E-mail: </label>
            <input type="text" name="email"> <br>

            <button type="submit">Salvar</button>
        </form>

        <h2>Tema Atual: {{ tema }}</h2>

        <div class="botoes">
            <a href="{{ url_for('trocar_tema', escolha='claro') }}">
                Tema Claro
            </a>
            <a href="{{ url_for('trocar_tema', escolha='escuro') }}">
                Tema Escuro
            </a>
        </div>
    </div>
</body>
</html>
