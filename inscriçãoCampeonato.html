<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição para Campeonato de Games</title>
</head>
<body>
    <h2>Inscrição para Campeonato de Games</h2>

    <form method="POST">
        <label>Nickname: </label> <br>
        <input type="text" name="nome"> <br><br>

        <label>E-mail> </label>
        <input type="text" name="email"> <br><br>

         <label>Jogo: </label>
        <select name="jogo">
            <option value="F"> Fortnite </option>
            <option value="M"> Minecraft </option>
            <option value="V"> Valorant </option>
            <option value="CS"> Counter Strike </option>
        </select> <br>
    </form>
</body>
</html>
