<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f0ffed;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }

        .caixa{
            background:white;
            padding:30px;
            border-radius:10px;
            width:300px;
            box-shadow:0 0 10px rgba(0,0,0,.2);
            text-align:center;
        }

        input,button{
            width:100%;
            padding:10px;
            margin:8px 0;
            box-sizing:border-box;
        }

        button{
            background:#4CAF50;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#3d9441;
        }

        p{
            color:red;
            font-weight:bold;
        }
    </style>
</head>
<body>

<div class="caixa">

    <h2>Login</h2>

    {% with mensagens = get_flashed_messages() %}
        {% if mensagens %}
            {% for mensagem in mensagens %}
                <p>{{ mensagem }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <input type="text" name="usuario" placeholder="Usuário" required>

        <input type="password" name="senha" placeholder="Senha" required>

        <button type="submit">Entrar</button>

    </form>

</div>

</body>
</html>
